# Local development and test examples only; never reuse these credentials in deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ai_operations
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ai_operations"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
