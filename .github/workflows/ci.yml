name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # API sessions are overridden by tests; migrations use only TEST_DATABASE_URL.
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      CI_POSTGRES_CONTAINER: ai-operations-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Start isolated PostgreSQL with generated credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          import subprocess
          import time
          from sqlalchemy.engine import URL

          username = f"ci_{secrets.token_hex(8)}"
          password = secrets.token_urlsafe(32)
          name = os.environ["CI_POSTGRES_CONTAINER"]
          database = "ai_operations_test"
          print(f"::add-mask::{password}", flush=True)
          environment = {**os.environ, "POSTGRES_USER": username,
                         "POSTGRES_PASSWORD": password, "POSTGRES_DB": database}
          subprocess.run([
              "docker", "run", "--detach", "--rm", "--name", name,
              "--env", "POSTGRES_USER", "--env", "POSTGRES_PASSWORD", "--env", "POSTGRES_DB",
              "--publish", "127.0.0.1::5432", "--tmpfs", "/var/lib/postgresql/data",
              "postgres:16-alpine",
          ], env=environment, check=True)
          for attempt in range(30):
              ready = subprocess.run([
                  "docker", "exec", name, "pg_isready", "--host", "127.0.0.1",
                  "--username", username, "--dbname", database,
              ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              if ready.returncode == 0:
                  break
              time.sleep(2)
          else:
              raise SystemExit("temporary PostgreSQL did not become ready")
          address = subprocess.check_output(["docker", "port", name, "5432/tcp"], text=True)
          port = int(address.strip().rsplit(":", 1)[1])
          url = URL.create("postgresql+psycopg", username=username, password=password,
                           host="127.0.0.1", port=port, database=database).render_as_string(
                               hide_password=False)
          print(f"::add-mask::{url}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a") as environment_file:
              environment_file.write(f"TEST_DATABASE_URL={url}\n")
          PY
      - run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: python -m ai_operations_agent.seed
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pytest -q
      - name: Remove temporary PostgreSQL
        if: always()
        run: |
          if docker container inspect "$CI_POSTGRES_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$CI_POSTGRES_CONTAINER"
          fi
